//
// Android app for the engine (docs/ANDROID-BUILD.md). Layout after SDL
// 2.32.10's android-project; SDL's Java sources come from its release
// tarball (app/build.gradle, fetchSdl), not from this tree.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'ct-recomp'
include ':app'
