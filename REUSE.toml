version = 1

# Licensing map for chrono-trigger-recomp.
#
# The project as a whole is distributed under GPL-3.0-or-later. It is built on
# ct-recomp (MIT), which itself vendors MIT and ISC components. Those files keep
# their original licenses and notices; see THIRD_PARTY.md.
#
# Precedence "closest": an SPDX header inside a file wins over this map, so a
# file we rewrite can carry its own GPL-3.0-or-later header.

# Default: everything we add.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 jerbanpls"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Imported from ThisIsAkill/ct-recomp at a6b49257e527d1f219ce6466075b5e035dd8e5f2.
[[annotations]]
path = [
  ".github/**",
  "ROADMAP.md",
  "frontend/**",
  "game/**",
  "recomp/**",
  "runtime/**",
  "test/**",
  "tools/**",
  "third_party/src/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Akhil Moola"
SPDX-License-Identifier = "MIT"

# Files that mix upstream MIT text with our GPL changes.
[[annotations]]
path = ["README.md", "THIRD_PARTY.md", ".gitignore", "CMakeLists.txt"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Akhil Moola", "2026 jerbanpls"]
SPDX-License-Identifier = "MIT AND GPL-3.0-or-later"

# zelda3 SNES core, vendored by ct-recomp (commit fbbb3f9).
[[annotations]]
path = "third_party/snes/**"
precedence = "closest"
SPDX-FileCopyrightText = ["2022 snesrev", "2021 elzo_d", "2026 Akhil Moola"]
SPDX-License-Identifier = "MIT"

# ares SPC700 core, vendored unmodified by ct-recomp (commit 4cb8d92).
[[annotations]]
path = "third_party/ares/**"
precedence = "closest"
SPDX-FileCopyrightText = "2004-2025 ares team, Near et al"
SPDX-License-Identifier = "ISC"

# cgltf (glTF 2.0 parser), vendored unmodified for asset packs' models
# (third_party/cgltf/README.md).
[[annotations]]
path = "third_party/cgltf/cgltf.h"
precedence = "closest"
SPDX-FileCopyrightText = "2018-2021 Johannes Kuhlmann"
SPDX-License-Identifier = "MIT"

# AMD FidelityFX FSR 1 (v1.0.2) and CAS (v1.0.2) headers and licenses,
# vendored unmodified, and our GLSL 3.30 / ES 3.00 port of them (MIT, with
# its own SPDX header); third_party/fidelityfx/README.md.
[[annotations]]
path = [
  "third_party/fidelityfx/ffx_a.h",
  "third_party/fidelityfx/ffx_fsr1.h",
  "third_party/fidelityfx/ffx_cas.h",
  "third_party/fidelityfx/LICENSE-FSR.txt",
  "third_party/fidelityfx/LICENSE-CAS.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2017-2021 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# Asset pack test data made for the tests (no game art): a glTF cube.
[[annotations]]
path = "test/data/packs/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 jerbanpls"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Upstream files with our (GPL-3.0-or-later) changes: the PPU layer G-buffer,
# its scheduler plumbing, the HD-2D frontend integration, build wiring, the
# engine-only first run, the ROM SHA-1 check, save files, the touch overlay
# hookup, the Android (CT_ANDROID) build, the portable context switch and
# overlay jump (arm64, docs/ANDROID.md), the handheld quit combo
# (docs/HANDHELD.md), decimal-mode ADC/SBC, and co-op (game patches in the
# translator, pad 2 in replay scripts).
[[annotations]]
path = [
  "recomp/emit.py",
  "recomp/funcs.py",
  "runtime/replay.c",
  "runtime/replay.h",
  "test/test_replay.c",
  "game/ct/funcs.toml",
  "third_party/snes/ppu.c",
  "third_party/snes/ppu.h",
  "runtime/sched.c",
  "runtime/sched.h",
  "frontend/main.c",
  "game/ct/CMakeLists.txt",
  "runtime/func_table.h",
  "tools/ct_boot.c",
  "tools/check_rom.py",
  "game/ct/game.toml",
  "runtime/spc700_host.cpp",
  "runtime/overlay.h",
  "test/test_record.py",
  "frontend/input.c",
  "frontend/input.h",
  "runtime/interp.c",
  "runtime/ops.h",
  "test/test_interp_modes.c",
  "test/test_runtime.c",
  "test/test_snes_bus.c",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2022 snesrev", "2021 elzo_d", "2026 Akhil Moola", "2026 jerbanpls"]
SPDX-License-Identifier = "MIT AND GPL-3.0-or-later"

# Button prompt pictures: Kenney Input Prompts (CC0-1.0), a subset of the
# 64 px "Default" PNGs, unmodified. Source and version in THIRD_PARTY.md and
# third_party/glyphs/README.md.
[[annotations]]
path = ["third_party/glyphs/*.png", "third_party/glyphs/License.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Kenney (www.kenney.nl)"
SPDX-License-Identifier = "CC0-1.0"

# Dear ImGui v1.92.9b (MIT), vendored unmodified for the settings menu
# (third_party/imgui/README.md); its stb headers keep their own notices.
[[annotations]]
path = ["third_party/imgui/*.cpp", "third_party/imgui/*.h", "third_party/imgui/LICENSE.txt",
        "third_party/imgui/backends/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2026 Omar Cornut"
SPDX-License-Identifier = "MIT"

# Roboto Medium, from Dear ImGui's misc/fonts (Apache-2.0).
[[annotations]]
path = "third_party/imgui/fonts/Roboto-Medium.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2011 Google Inc. (Roboto, Christian Robertson)"
SPDX-License-Identifier = "Apache-2.0"

# The Deck-format hidraw reader: its report parsing and rumble command are
# ported from SDL's Steam Deck driver (SDL_hidapi_steamdeck.c, 2023 Max Maisel) and
# steam/controller_structs.h (2020 Valve Corporation), zlib license, notice
# kept in the file (THIRD_PARTY.md). The file's own header says the same.
[[annotations]]
path = "frontend/hid_deck.c"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 jerbanpls", "2023 Max Maisel", "2020 Valve Corporation"]
SPDX-License-Identifier = "GPL-3.0-or-later AND Zlib"
