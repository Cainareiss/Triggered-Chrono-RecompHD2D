version = 1

# Licensing map for chrono-trigger-recomp.
#
# The project as a whole is distributed under GPL-3.0-or-later. It is built on
# ct-recomp (MIT), which itself vendors MIT and ISC components. Those files keep
# their original licenses and notices; see THIRD_PARTY.md.
#
# Precedence "closest": an SPDX header inside a file wins over this map, so a
# file we rewrite can carry its own GPL-3.0-or-later header.

# Default: everything we add.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 jerbanpls"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Imported from ThisIsAkill/ct-recomp at a6b49257e527d1f219ce6466075b5e035dd8e5f2.
[[annotations]]
path = [
  ".github/**",
  "ROADMAP.md",
  "frontend/**",
  "game/**",
  "recomp/**",
  "runtime/**",
  "test/**",
  "tools/**",
  "third_party/src/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Akhil Moola"
SPDX-License-Identifier = "MIT"

# Files that mix upstream MIT text with our GPL changes.
[[annotations]]
path = ["README.md", "THIRD_PARTY.md", ".gitignore", "CMakeLists.txt"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Akhil Moola", "2026 jerbanpls"]
SPDX-License-Identifier = "MIT AND GPL-3.0-or-later"

# zelda3 SNES core, vendored by ct-recomp (commit fbbb3f9).
[[annotations]]
path = "third_party/snes/**"
precedence = "closest"
SPDX-FileCopyrightText = ["2022 snesrev", "2021 elzo_d", "2026 Akhil Moola"]
SPDX-License-Identifier = "MIT"

# ares SPC700 core, vendored unmodified by ct-recomp (commit 4cb8d92).
[[annotations]]
path = "third_party/ares/**"
precedence = "closest"
SPDX-FileCopyrightText = "2004-2025 ares team, Near et al"
SPDX-License-Identifier = "ISC"

# Upstream files with our (GPL-3.0-or-later) changes: the PPU layer G-buffer,
# its scheduler plumbing, the HD-2D frontend integration, build wiring, the
# engine-only first run, the ROM SHA-1 check, save files, the touch overlay
# hookup, the Android (CT_ANDROID) build, and the portable context switch and
# overlay jump (arm64, docs/ANDROID.md), and decimal-mode ADC/SBC.
[[annotations]]
path = [
  "third_party/snes/ppu.c",
  "third_party/snes/ppu.h",
  "runtime/sched.c",
  "runtime/sched.h",
  "frontend/main.c",
  "game/ct/CMakeLists.txt",
  "runtime/func_table.h",
  "tools/ct_boot.c",
  "tools/check_rom.py",
  "game/ct/game.toml",
  "runtime/spc700_host.cpp",
  "runtime/overlay.h",
  "test/test_record.py",
  "runtime/interp.c",
  "runtime/ops.h",
  "test/test_interp_modes.c",
  "test/test_runtime.c",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2022 snesrev", "2021 elzo_d", "2026 Akhil Moola", "2026 jerbanpls"]
SPDX-License-Identifier = "MIT AND GPL-3.0-or-later"
